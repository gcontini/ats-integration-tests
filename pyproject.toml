# ats-integration-tests — the client and the server, side by side.
#
#   contracts/          the wire format: the ats-strike-contract repository
#   ats-strike/         the server and its pipeline: the ats-strike repository
#   ats-strike-client/  the CLI: the ats-strike-client repository
#
# All three are git submodules, and this workspace takes its members from
# them. The commits they point at are the combination under test; a change in
# one of them is a commit there plus the new pointer here.
#
#     git submodule update --init   check the three out (not --recursive)
#     uv sync                       install every member into one .venv, editable
#     uv run pytest                 the integration test and cv-eval's scoring tests
#     uv run python tests/cv_quality/cv_eval.py --help    cv-eval, see its skill

[tool.uv.workspace]
members = ["contracts", "ats-strike", "ats-strike-client/client"]

# Each member names a source for ats-strike-contracts in its own repository
# (the client `{ workspace = true }`, the server `{ path = "src/contracts" }`),
# where the contracts are a submodule of its own: not checked out here, and a
# second copy of the package if they were. Ignoring those sources makes the
# name resolve to the member above, so every package here uses the one
# contracts/ at the top.
[tool.uv]
no-sources-package = ["ats-strike-contracts"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["latex: needs a pdflatex binary on PATH"]
