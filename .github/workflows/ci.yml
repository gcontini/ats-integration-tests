name: CI

# The combination the three submodule pointers name, tested together. Bumping
# a pointer is a push here, so a new server or client is tested against the
# other half as soon as it is pinned.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Client and servers in one process, real routing and the real pipeline,
  # only the model endpoint faked; plus cv-eval's scoring tests.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The three repositories under test. Not recursive: the submodules'
          # own contracts/ would be second copies, and nothing here uses them.
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # The CV the integration test writes is compiled for real; without these
      # its PDF checks skip themselves.
      - name: Install the LaTeX toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
             texlive-latex-base texlive-fonts-extra cm-super
      - run: uv sync --frozen
      - run: uv run pytest -q

  # The built executable against a running server: not "does it start" but
  # "does it talk to a server".
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen

      - name: Cache the PyInstaller analysis
        uses: actions/cache@v6
        with:
          path: build
          key: pyinstaller-${{ hashFiles('uv.lock', 'ats-strike-client/client/packaging/cv.spec') }}

      - name: Build the executable
        run: uv run --with pyinstaller pyinstaller --noconfirm ats-strike-client/client/packaging/cv.spec

      - name: Install a minimal LaTeX
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
             texlive-latex-base

      - name: Render a PDF through a running server
        env:
          MODEL_API_KEY: ci
          MODEL_BASE_URL: http://invalid/v1
          # The CV steps call provider 2, and every role is built at startup.
          MODEL_API_KEY2: ci
          MODEL_BASE_URL2: http://invalid/v1
          # The analysis and letter roles call provider 3.
          MODEL_API_KEY3: ci
          MODEL_BASE_URL3: http://invalid/v1
          PORT: "8080"
          # The runner's /tmp is shared and holds unreadable directories;
          # the server should not have to scan it at all.
          ATS_WORK_DIR: ${{ runner.temp }}/ats-strike-work
        run: |
          set -eux
          uv run ats-strike &
          for i in $(seq 1 30); do
            curl -fsS localhost:8080/healthz && break || sleep 2
          done
          printf '%s\n' \
            '\documentclass{article}' \
            '\begin{document}Hello from CI.\end{document}' > smoke.tex
          # A data folder holding one server folder, the default.
          mkdir -p smoke/local
          printf '[servers.local]\nfolder = "local"\nurl = "http://localhost:8080"\n' > smoke/cv.toml
          # No model is reachable here, and render needs none: this is
          # multipart in, envelope out, pdflatex, base64 back, PDF on disk.
          ./dist/cv -v --data-dir smoke render smoke.tex
          head -c 4 smoke.pdf | grep -q '%PDF'
